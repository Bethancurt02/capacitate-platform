<div class="login-container">
  <div class="login-card animate-fade-in">
    <div class="login-header text-center mb-4">
      <img src="assets/logo.png" alt="Logo" class="login-logo" style="width: 80px; margin-bottom: 1rem;">
      <h2 class="mt-3">Crear Cuenta</h2>
      <p class="text-muted">Únete a nuestra comunidad de aprendizaje</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div *ngIf="errorMessage" class="error-banner">
        <i class="fas fa-exclamation-circle mr-2"></i> {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
          </div>
          <input 
            type="text" 
            id="nombre" 
            class="form-control"
            formControlName="nombre" 
            placeholder="Tu nombre"
            [class.is-invalid]="f['nombre'].invalid && (f['nombre'].dirty || f['nombre'].touched)">
        </div>
        <div class="error-messages" *ngIf="f['nombre'].invalid && (f['nombre'].dirty || f['nombre'].touched)">
          <small class="text-danger" *ngIf="f['nombre'].errors?.['required']">Este campo es obligatorio</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          </div>
          <input 
            type="email" 
            id="email" 
            class="form-control"
            formControlName="email" 
            placeholder="correo@ejemplo.com"
            [class.is-invalid]="f['email'].invalid && (f['email'].dirty || f['email'].touched)">
        </div>
        <div class="error-messages" *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched)">
          <small class="text-danger" *ngIf="f['email'].errors?.['required']">Este campo es obligatorio</small>
          <small class="text-danger" *ngIf="f['email'].errors?.['email'] && !f['email'].errors?.['required']">Correo no válido</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
          </div>
          <input 
            type="password" 
            id="password" 
            class="form-control"
            formControlName="password" 
            placeholder="Mínimo 6 caracteres"
            [class.is-invalid]="f['password'].invalid && (f['password'].dirty || f['password'].touched)">
        </div>
        <div class="error-messages" *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)">
          <small class="text-danger" *ngIf="f['password'].errors?.['required']">Este campo es obligatorio</small>
          <small class="text-danger" *ngIf="f['password'].errors?.['minlength'] && !f['password'].errors?.['required']">Mínimo 6 caracteres</small>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-check-circle"></i></span>
          </div>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-control"
            formControlName="confirmPassword" 
            placeholder="Repite tu contraseña"
            [class.is-invalid]="f['confirmPassword'].invalid && (f['confirmPassword'].dirty || f['confirmPassword'].touched)">
        </div>
        <div class="error-messages" *ngIf="(f['confirmPassword'].dirty || f['confirmPassword'].touched) && (f['confirmPassword'].invalid || registerForm.errors?.['mismatch'])">
          <small class="text-danger" *ngIf="f['confirmPassword'].errors?.['required']">Debes confirmar tu contraseña</small>
          <small class="text-danger" *ngIf="registerForm.errors?.['mismatch'] && !f['confirmPassword'].errors?.['required']">Las contraseñas no coinciden</small>
        </div>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-block btn-lg mt-4" 
        [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Registrarse</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
      </button>

      <div class="text-center mt-4">
        <p>¿Ya tienes una cuenta? <a routerLink="/login" class="login-link">Inicia sesión aquí</a></p>
      </div>

    </form>
  </div>
</div>
